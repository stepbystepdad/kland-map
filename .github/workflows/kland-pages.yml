name: Build and publish K Land

on:
  push:
    branches: [main]
    paths:
      - 'standalone/**'
      - '.github/workflows/kland-pages.yml'
      - 'package.json'
      - 'k-land-terrain.svg'
      - 'k-house.webp'
      - 'bare-minimum-bungalow.webp'
      - 'conversations.json'
  pull_request:
    paths:
      - 'standalone/**'
      - '.github/workflows/kland-pages.yml'
      - 'package.json'
      - 'k-land-terrain.svg'
      - 'k-house.webp'
      - 'bare-minimum-bungalow.webp'
      - 'conversations.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kland-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install image build dependency
        run: python -m pip install --disable-pip-version-check -r standalone/requirements.txt

      - name: Build the complete site
        env:
          KLAND_COMMIT_SHA: ${{ github.sha }}
        run: python standalone/scripts/build.py

      - name: Run checks
        run: npm test

      - name: Remove the local-only preview
        run: rm standalone/dist/preview-phone.html

      - name: Check deployment connection
        id: connection
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Build checks passed. Publishing is waiting for the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
            echo '### Deployment not connected' >> "$GITHUB_STEP_SUMMARY"
            echo 'Build checks passed. Add the two Cloudflare repository secrets, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the existing Cloudflare Pages project
        if: steps.connection.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy standalone/dist --project-name=kland-kevinsilvester --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Verify the production revision
        if: steps.connection.outputs.configured == 'true'
        env:
          KLAND_COMMIT_SHA: ${{ github.sha }}
        run: node standalone/scripts/verify-deployment.mjs
